services:
  postgres:
    image: postgres:16-alpine
    container_name: reelverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: reelverse
      POSTGRES_USER: reelverse
      POSTGRES_PASSWORD: reelverse
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelverse -d reelverse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: reelverse-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reelverse-backend
    restart: unless-stopped
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql://reelverse:reelverse@postgres:5432/reelverse?serverVersion=16&charset=utf8
      REDIS_URL: redis://redis:6379
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: php -S 0.0.0.0:8000 -t public

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: reelverse-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"

volumes:
  postgres_data: