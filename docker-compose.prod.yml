name: reelverse-prod

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reelverse
      POSTGRES_USER: reelverse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?a definir dans .env.prod}
    command: >
      postgres
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=8MB
      -c max_connections=40
      -c checkpoint_timeout=15min
      -c max_wal_size=1GB
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reelverse -d reelverse"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?a definir dans .env.prod}
    command:
      [
        "redis-server",
        "--requirepass", "${REDIS_PASSWORD}",
        "--maxmemory", "128mb",
        "--maxmemory-policy", "allkeys-lru",
        "--save", "",
        "--appendonly", "no"
      ]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  backend:
    image: ghcr.io/fayssalmechmeche/reelverse-backend:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: prod
      APP_DEBUG: "0"
      APP_SECRET: ${APP_SECRET:?a definir dans .env.prod}
      DATABASE_URL: postgresql://reelverse:${POSTGRES_PASSWORD}@postgres:5432/reelverse?serverVersion=16&charset=utf8
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_PASSPHRASE: ${JWT_PASSPHRASE:?a definir dans .env.prod}
      FRONTEND_URL: ${FRONTEND_URL:?a definir dans .env.prod}
      DEFAULT_URI: ${FRONTEND_URL}
      APP_SECURE_COOKIES: ${APP_SECURE_COOKIES:-true}
      MAILER_DSN: ${MAILER_DSN:-null://null}
      MAILER_FROM: ${MAILER_FROM:-no-reply@reelverse.me}
      MESSENGER_TRANSPORT_DSN: doctrine://default?auto_setup=0
      TMDB_READ_TOKEN: ${TMDB_READ_TOKEN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID:-}
      DISCORD_CLIENT_SECRET: ${DISCORD_CLIENT_SECRET:-}
    volumes:
      - ./secrets/jwt:/app/config/jwt:ro
      - avatars:/app/var/uploads
    ports:
      - "127.0.0.1:8080:8080"
    tmpfs:
      - /tmp
    logging: *logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - backend
    profiles: ["tunnel"]
    logging: *logging

volumes:
  avatars:
  postgres_data: