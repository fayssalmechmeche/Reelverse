security:
    password_hashers:
        App\User\User:
            algorithm: auto

    providers:
        app_user_provider:
            entity:
                class: App\User\User
                property: email

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        login:
            pattern: ^/api/login$
            stateless: true
            user_checker: App\User\Security\UserChecker
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: App\User\Security\LoginFailureHandler
            login_throttling:
                max_attempts: 5
                interval: "15 minutes"

        # Routes publiques : sans firewall, un vieux cookie JWT expiré ne les bloque plus.
        public:
            pattern: ^/api/(register|forgot-password|reset-password|logout|connect/(google|discord)(/check)?)$
            stateless: true
            security: false

        api:
            pattern: ^/api
            stateless: true
            user_checker: App\User\Security\UserChecker
            jwt: ~

        main:
            lazy: true
            provider: app_user_provider

    access_control:
        - { path: ^/api/login$, roles: PUBLIC_ACCESS }
        - { path: ^/api/register$, roles: PUBLIC_ACCESS }
        - { path: ^/api/forgot-password$, roles: PUBLIC_ACCESS }
        - { path: ^/api/reset-password$, roles: PUBLIC_ACCESS }
        - { path: ^/api/logout$, roles: PUBLIC_ACCESS }
        - { path: ^/api/docs, roles: PUBLIC_ACCESS }
        - { path: ^/api, roles: IS_AUTHENTICATED_FULLY }
        - {
              path: ^/api/connect/(google|discord)(/check)?$,
              roles: PUBLIC_ACCESS,
          }
